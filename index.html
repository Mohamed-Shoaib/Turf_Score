<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turf Score">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Turf Score</title>
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack-Regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Work Sans';src:url('fonts/WorkSans-Regular.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  --turf-1:#0F3D2E;--turf-2:#1D6B4C;--turf-3:#2F8F63;--chalk:#F4F1E6;--flood:#E8B23D;--ball-red:#B4432C;
  --bg:#F4F1E6;--card:#fff;--line:rgba(19,32,23,.12);--text:#132017;--text2:#4B5A50;--accent:var(--turf-2);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B1712;--card:#122019;--line:rgba(244,241,230,.14);--text:#F4F1E6;--text2:#9FB3A6;--accent:var(--turf-3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Work Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.brand h1{font-family:'Archivo Black',system-ui,sans-serif;font-size:22px;margin:0;color:var(--accent)}
.brand span{font-size:13px;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--text2);margin:10px 0 5px}
input{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:inherit;font-weight:600;font-size:15px;padding:12px 14px;border-radius:10px;border:1px solid var(--turf-2);background:var(--turf-2);color:var(--chalk);cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--ball-red);color:var(--ball-red)}
.btn.small{padding:8px 10px;font-size:13px}
.scoreboard{background:var(--turf-1);border-radius:16px;padding:20px 18px;color:var(--chalk);margin-bottom:14px}
.sb-top{display:flex;justify-content:space-between;align-items:flex-start}
.sb-team{font-size:13px;color:var(--flood)}
.sb-score{font-family:'Archivo Black',system-ui,sans-serif;font-size:44px;line-height:1;margin:6px 0 2px}
.sb-overs{font-size:13px;color:#C9D8CE}
.sb-target{margin-top:10px;padding-top:10px;border-top:1px solid rgba(244,241,230,.18);font-size:13px;color:#C9D8CE}
.sb-target b{color:var(--chalk)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.runbtn{font-family:'Archivo Black',system-ui,sans-serif;font-size:20px;padding:14px 0;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.runbtn:active{background:var(--turf-2);color:var(--chalk)}
.extras{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.extras button{font-family:inherit;font-size:13px;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.wicketbtn{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--ball-red);background:transparent;color:var(--ball-red);font-weight:700;font-size:14px;cursor:pointer}
.wicketbtn:active{background:var(--ball-red);color:var(--chalk)}
.actions-row{display:flex;gap:8px;margin-top:12px}
.actions-row .btn{width:auto;flex:1}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 8px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.history-item:last-child{border-bottom:none}
.history-main b{display:block}
.history-meta{font-size:12px;color:var(--text2)}
.del-x{background:none;border:none;color:var(--ball-red);font-size:18px;cursor:pointer;padding:4px 8px}
.empty{font-size:13px;color:var(--text2);text-align:center;padding:10px 0}
.hidden{display:none}
.result-banner{background:var(--flood);color:#3A2A05;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px;margin-bottom:14px;text-align:center}
.log{font-size:12px;color:var(--text2);margin-top:8px;min-height:16px}
.over-chips{display:flex;flex-wrap:wrap;gap:8px}
.over-row{margin-bottom:12px}
.over-row:last-child{margin-bottom:0}
.over-row-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.over-chip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',system-ui,sans-serif;font-size:13px;background:var(--turf-1);color:var(--chalk)}
.over-chip.wd,.over-chip.nb{background:var(--flood);color:#3A2A05}
.over-chip.w{background:var(--ball-red);color:var(--chalk)}
.over-chip.placeholder{background:transparent;border:1px dashed var(--line);color:var(--text2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>Turf Score</h1><span id="dateTag"></span></div>

  <div id="setupScreen">
    <div class="card">
      <div class="section-title">New match</div>
      <label for="teamAName">Team batting first</label>
      <input type="text" id="teamAName" placeholder="e.g. Falcons" maxlength="20">
      <label for="teamBName">Team batting second</label>
      <input type="text" id="teamBName" placeholder="e.g. Strikers" maxlength="20">
      <div class="row2">
        <div><label for="oversLimit">Overs (0 = no limit)</label><input type="number" id="oversLimit" value="6" min="0" max="50"></div>
        <div><label for="playersPerSide">Players per side</label><input type="number" id="playersPerSide" value="7" min="2" max="11"></div>
      </div>
      <div style="margin-top:16px"><button class="btn" id="startMatchBtn">Start match</button></div>
    </div>
    <div class="card">
      <div class="section-title">Past matches</div>
      <div id="historyList"><div class="empty">No matches saved yet.</div></div>
    </div>
  </div>

  <div id="matchScreen" class="hidden">
    <div id="resultBanner" class="result-banner hidden"></div>
    <div class="scoreboard">
      <div class="sb-top">
        <div>
          <div class="sb-team" id="battingTeamLabel"></div>
          <div class="sb-score" id="scoreLine">0/0</div>
          <div class="sb-overs" id="oversLine">0.0 overs</div>
        </div>
        <div style="text-align:right"><div class="sb-team" id="oppTeamLabel"></div></div>
      </div>
      <div class="sb-target hidden" id="targetLine"></div>
    </div>
    <div class="card">
      <div class="section-title">Runs off this ball</div>
      <div class="grid3">
        <button class="runbtn" data-run="0">0</button><button class="runbtn" data-run="1">1</button><button class="runbtn" data-run="2">2</button>
        <button class="runbtn" data-run="3">3</button><button class="runbtn" data-run="4">4</button><button class="runbtn" data-run="6">6</button>
      </div>
      <div class="extras"><button id="wideBtn">Wide</button><button id="noballBtn">No ball</button></div>
      <button class="wicketbtn" id="wicketBtn">Wicket</button>
      <div class="log" id="lastAction"></div>
      <div class="actions-row">
        <button class="btn ghost small" id="undoBtn">Undo</button>
        <button class="btn ghost small" id="endInningsBtn">End innings</button>
      </div>
    </div>
    <div class="card"><div class="section-title">Ball by ball</div><div id="overChips"></div></div>
    <div class="actions-row"><button class="btn danger" id="abandonBtn">Abandon match</button></div>
  </div>
</div>

<script>
const LS_STATE='turfscore_current_match',LS_HISTORY='turfscore_history';
let state=null;
const el=id=>document.getElementById(id);
function loadState(){try{const r=localStorage.getItem(LS_STATE);return r?JSON.parse(r):null}catch(e){return null}}
function saveState(){try{localStorage.setItem(LS_STATE,JSON.stringify(state))}catch(e){}}
function clearState(){try{localStorage.removeItem(LS_STATE)}catch(e){}state=null}
function loadHistory(){try{const r=localStorage.getItem(LS_HISTORY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHistory(l){try{localStorage.setItem(LS_HISTORY,JSON.stringify(l))}catch(e){}}
const newInnings=()=>({runs:0,wickets:0,balls:0,history:[]});
const ballsToOvers=b=>Math.floor(b/6)+'.'+(b%6);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderSetup(){
  el('setupScreen').classList.remove('hidden');
  el('matchScreen').classList.add('hidden');
  const hist=loadHistory(),listEl=el('historyList');
  if(!hist.length){listEl.innerHTML='<div class="empty">No matches saved yet.</div>';return}
  listEl.innerHTML='';
  hist.slice().reverse().forEach(m=>{
    const row=document.createElement('div');
    row.className='history-item';
    row.innerHTML=`<div class="history-main"><b>${escapeHtml(m.teamA)} ${m.scoreA} vs ${escapeHtml(m.teamB)} ${m.scoreB}</b><span class="history-meta">${escapeHtml(m.result)} &middot; ${m.date}</span></div><button class="del-x" aria-label="Delete match" data-id="${m.id}">&times;</button>`;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.del-x').forEach(btn=>btn.addEventListener('click',()=>{
    saveHistory(loadHistory().filter(m=>m.id!==btn.getAttribute('data-id')));
    renderSetup();
  }));
}

function startMatch(){
  const teamA=(el('teamAName').value||'Team A').trim(),teamB=(el('teamBName').value||'Team B').trim();
  const overs=Math.max(0,parseInt(el('oversLimit').value||'0',10));
  const players=Math.min(11,Math.max(2,parseInt(el('playersPerSide').value||'7',10)));
  state={teamA,teamB,oversLimit:overs,maxWickets:players-1,inningsNo:1,innings1:newInnings(),innings2:newInnings(),battingFirst:'A',finished:false,result:''};
  saveState();renderMatch();
}
const currentInnings=()=>state.inningsNo===1?state.innings1:state.innings2;
function battingTeamName(){const a=state.battingFirst==='A';return state.inningsNo===1?(a?state.teamA:state.teamB):(a?state.teamB:state.teamA)}
function bowlingTeamName(){const a=state.battingFirst==='A';return state.inningsNo===1?(a?state.teamB:state.teamA):(a?state.teamA:state.teamB)}
function inningsOver(i){return i.wickets>=state.maxWickets||(state.oversLimit>0&&i.balls>=state.oversLimit*6)}
const target=()=>state.innings1.runs+1;
const checkChaseWin=()=>state.inningsNo===2&&state.innings2.runs>=target();
function setLog(m){el('lastAction').textContent=m}

function record(type,runs){
  if(state.finished)return;
  const inn=currentInnings();
  if(type==='run'){inn.runs+=runs;inn.balls++;inn.history.push({type:'run',val:runs});setLog(runs===0?'Dot ball':runs+' run'+(runs>1?'s':''))}
  else if(type==='wide'){inn.history.push({type:'wide',val:0});setLog('Wide: extra ball')}
  else if(type==='noball'){inn.history.push({type:'noball',val:0});setLog('No ball: extra ball')}
  else if(type==='wicket'){inn.wickets++;inn.balls++;inn.history.push({type:'wicket',val:0});setLog('Wicket! '+inn.wickets+' down')}
  saveState();evaluateMatchState();renderMatch();
}

function undo(){
  const inn=currentInnings();
  if(state.finished){state.finished=false;state.result='';removeLastHistory()}
  const last=inn.history.pop();
  if(!last){renderMatch();return}
  if(last.type==='run'){inn.runs-=last.val;inn.balls--}
  else if(last.type==='wicket'){inn.wickets--;inn.balls--}
  else{inn.runs-=last.val}
  setLog('Last ball undone');saveState();renderMatch();
}
function removeLastHistory(){const h=loadHistory();h.pop();saveHistory(h)}

function evaluateMatchState(){
  const inn=currentInnings();
  if(checkChaseWin()){finishMatch();return}
  if(inningsOver(inn)){
    if(state.inningsNo===1){state.inningsNo=2;setLog('Innings 1 complete. '+battingTeamName()+' now batting, target '+target())}
    else finishMatch();
  }
}

function finishMatch(){
  state.finished=true;
  const s1=state.innings1,s2=state.innings2;
  const first=state.battingFirst==='A'?state.teamA:state.teamB,second=state.battingFirst==='A'?state.teamB:state.teamA;
  let r;
  if(s2.runs>s1.runs){const w=state.maxWickets-s2.wickets;r=second+' won by '+w+' wicket'+(w===1?'':'s')}
  else if(s1.runs>s2.runs){const m=s1.runs-s2.runs;r=first+' won by '+m+' run'+(m===1?'':'s')}
  else r='Match tied';
  state.result=r;saveState();saveMatchToHistory();
}

function saveMatchToHistory(){
  const s1=state.innings1,s2=state.innings2;
  const first=state.battingFirst==='A'?state.teamA:state.teamB,second=state.battingFirst==='A'?state.teamB:state.teamA;
  const hist=loadHistory();
  hist.push({id:'m_'+Date.now(),teamA:first,teamB:second,scoreA:s1.runs+'/'+s1.wickets,scoreB:s2.runs+'/'+s2.wickets,result:state.result,
    date:new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})});
  saveHistory(hist);
}

function endInningsManually(){
  if(state.inningsNo===1){state.inningsNo=2;setLog('Innings 1 ended. Target '+target());saveState();renderMatch()}
  else{finishMatch();renderMatch()}
}

function allOverGroups(inn){
  let legal=0;const g=[[]];
  for(const e of inn.history){
    g[g.length-1].push(e);
    if(e.type==='run'||e.type==='wicket'){legal++;if(legal%6===0)g.push([])}
  }
  return g;
}
function chipFor(e){
  const c=document.createElement('div');
  if(e.type==='run'){c.className='over-chip';c.textContent=e.val}
  else if(e.type==='wide'){c.className='over-chip wd';c.textContent='Wd'}
  else if(e.type==='noball'){c.className='over-chip nb';c.textContent='Nb'}
  else{c.className='over-chip w';c.textContent='W'}
  return c;
}
function renderOverChips(inn){
  const wrap=el('overChips');wrap.innerHTML='';
  const groups=allOverGroups(inn),lastIdx=groups.length-1;
  groups.map((g,i)=>i).reverse().forEach(idx=>{
    const group=groups[idx],isLast=idx===lastIdx;
    if(!group.length&&!isLast)return;
    const row=document.createElement('div');row.className='over-row';
    const label=document.createElement('div');label.className='over-row-label';label.textContent='Over '+(idx+1);
    row.appendChild(label);
    const chips=document.createElement('div');chips.className='over-chips';
    group.forEach(e=>chips.appendChild(chipFor(e)));
    if(isLast){
      const done=group.filter(e=>e.type==='run'||e.type==='wicket').length;
      for(let i=done;i<6;i++){const ph=document.createElement('div');ph.className='over-chip placeholder';ph.textContent=i+1;chips.appendChild(ph)}
    }
    row.appendChild(chips);wrap.appendChild(row);
  });
}

function renderMatch(){
  el('setupScreen').classList.add('hidden');
  el('matchScreen').classList.remove('hidden');
  const inn=currentInnings();
  el('battingTeamLabel').textContent=battingTeamName().toUpperCase();
  el('oppTeamLabel').textContent='vs '+bowlingTeamName().toUpperCase();
  el('scoreLine').textContent=inn.runs+'/'+inn.wickets;
  el('oversLine').textContent=ballsToOvers(inn.balls)+(state.oversLimit>0?' of '+state.oversLimit:'')+' overs';
  renderOverChips(inn);
  const tl=el('targetLine');
  if(state.inningsNo===2&&!state.finished){
    const need=Math.max(0,target()-inn.runs);
    const left=state.oversLimit>0?Math.max(0,state.oversLimit*6-inn.balls):null;
    let t='Target <b>'+target()+'</b> &middot; need <b>'+need+'</b> run'+(need===1?'':'s');
    if(left!==null)t+=' from <b>'+left+'</b> ball'+(left===1?'':'s');
    tl.innerHTML=t;tl.classList.remove('hidden');
  }else tl.classList.add('hidden');
  const banner=el('resultBanner');
  if(state.finished){banner.textContent=state.result;banner.classList.remove('hidden')}else banner.classList.add('hidden');
  document.querySelectorAll('.runbtn,#wideBtn,#noballBtn,#wicketBtn,#endInningsBtn').forEach(b=>{
    b.style.opacity=state.finished?'0.4':'1';b.style.pointerEvents=state.finished?'none':'auto';
  });
  el('endInningsBtn').textContent=state.finished?'Match complete':(state.inningsNo===1?'End innings':'End match');
  el('abandonBtn').textContent=state.finished?'New match':'Abandon match';
}

document.querySelectorAll('.runbtn').forEach(b=>b.addEventListener('click',()=>record('run',parseInt(b.getAttribute('data-run'),10))));
el('wideBtn').addEventListener('click',()=>record('wide'));
el('noballBtn').addEventListener('click',()=>record('noball'));
el('wicketBtn').addEventListener('click',()=>record('wicket'));
el('undoBtn').addEventListener('click',undo);
el('endInningsBtn').addEventListener('click',()=>{if(!state.finished)endInningsManually()});
el('abandonBtn').addEventListener('click',()=>{
  const wasDone=state&&state.finished;
  clearState();
  if(wasDone){el('teamAName').value='';el('teamBName').value=''}
  renderSetup();
});
el('startMatchBtn').addEventListener('click',startMatch);
el('dateTag').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const existing=loadState();
if(existing){state=existing;renderMatch()}else renderSetup();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
